spring:
  config:
    # 로컬 실행 시 .env/.env.local 값을 선택적으로 읽어온다.
    import: optional:file:.env/.env.local[.properties]
  profiles:
    default: local
  application:
    name: ${KAIROS_APP_NAME:kairos}
  jpa:
    # 웹 계층에서 지연 로딩을 이어가지 않고 서비스 트랜잭션 안에서만 DB 접근하게 강제한다.
    open-in-view: false

kairos:
  jwt:
    # 운영/개발 환경 모두 환경 변수로 바꿔 끼울 수 있게 열어둔다.
    issuer: ${KAIROS_JWT_ISSUER:kairos}
    secret: ${KAIROS_JWT_SECRET}
    access-token-expiration: ${KAIROS_JWT_ACCESS_TOKEN_EXPIRATION:15m}
    refresh-token-expiration: ${KAIROS_JWT_REFRESH_TOKEN_EXPIRATION:30d}
  ai:
    openai:
      base-url: ${KAIROS_AI_OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${KAIROS_AI_OPENAI_API_KEY:}
    anthropic:
      base-url: ${KAIROS_AI_ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${KAIROS_AI_ANTHROPIC_API_KEY:}
      version: ${KAIROS_AI_ANTHROPIC_VERSION:2023-06-01}
    gemini:
      base-url: ${KAIROS_AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      api-key: ${KAIROS_AI_GEMINI_API_KEY:}

management:
  server:
    # 지표 엔드포인트는 내부 구조를 그대로 드러내므로 서비스 포트와 분리한다.
    # Phase 5에서 이 포트는 VPC 안에서만 열리고 ALB로는 노출하지 않는다.
    port: ${KAIROS_MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        # 필요한 것만 연다. 기본으로 열리는 env, beans 같은 것은 내부 설정을 그대로 보여준다.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # p95 같은 분위수를 Prometheus 쪽에서 계산하려면 버킷이 함께 나가야 한다.
      percentiles-histogram:
        kairos.ai.request.duration: true
      slo:
        kairos.ai.request.duration: 500ms,1s,3s,10s,30s

logging:
  pattern:
    # 모든 로그에서 요청 추적용 traceId를 바로 확인할 수 있게 MDC 값을 붙인다.
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) [%X{traceId:-no-trace}] %clr(${PID:- }){magenta} --- [%15.15t] %clr(%-40.40logger{39}){cyan} : %m%n%wEx"

resilience4j:
  bulkhead:
    configs:
      default:
        # 대기 없이 즉시 거절한다. 대기시키면 스레드가 그대로 붙잡혀 격리의 의미가 사라진다.
        max-wait-duration: 0
        max-concurrent-calls: 32
    instances:
      openai:
        base-config: default
      anthropic:
        base-config: default
      gemini:
        base-config: default

  circuitbreaker:
    configs:
      default:
        # 재시도할 가치가 있는 실패만 집계한다. 잘못된 API key 같은 4xx로 서킷이 열리면
        # provider는 멀쩡한데 우리가 스스로 길을 막는 셈이 된다.
        record-failure-predicate: io.github.drawjustin.kairos.ai.provider.RetryableProviderFailure
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      openai:
        base-config: default
      anthropic:
        base-config: default
      gemini:
        base-config: default

  retry:
    configs:
      default:
        # 5xx와 타임아웃만 다시 건다. 4xx는 몇 번을 걸어도 같은 답이 오므로 부하만 늘린다.
        retry-exception-predicate: io.github.drawjustin.kairos.ai.provider.RetryableProviderFailure
        max-attempts: 3
        wait-duration: 200ms
        # 장애 상황에서 모든 요청이 같은 간격으로 몰리면 회복을 오히려 늦춘다.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.3
    instances:
      openai:
        base-config: default
      anthropic:
        base-config: default
      gemini:
        base-config: default
